# pytest.ini
[pytest]
# 保证从任意工作目录收集用例时都能找到 common1、settings（pytest 7+）
pythonpath = .
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
# importlib 避免多产品线同名 test_*.py 的 import 冲突，避免 IDE/全量发现失败；仍建议各目录用不重复文件名
# continue：部分模块因 Excel/依赖在收集阶段即失败时，不阻断其余用例的收集与发现
# ignore 若干文件：Excel 暂无对应 sheet；与数据同步后去掉。全目录 ignore 放在 .vscode/settings.json 的 python.testing.pytestArgs 里，避免强喂终端默认不跑某产品线
addopts = -s --continue-on-collection-errors --import-mode=importlib --ignore=testcases/UltraArm_P1/test_13_get_run_status.py --ignore=testcases/UltraArm_P1/test_15_get_zero_calibration_state.py --ignore=testcases/UltraArm_P1/test_55_get_base_io_input.py --ignore=testcases/UltraArm_P1_Attachments/test_close_laser.py --ignore=testcases/UltraArm_P1_Attachments/test_set_gripper_parameter.py
# 已安装 allure-pytest 时可在命令行追加: --alluredir=allure-results
markers =
    hardware: 需要连接真实机械臂/控制器（testcases 下用例默认自动打标）
    slow: 长耗时用例（大范围运动、多步等待等）
    smoke: 快速冒烟，适合环境/连接首批验证
