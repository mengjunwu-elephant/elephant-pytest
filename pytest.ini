# pytest.ini
[pytest]
# 保证从任意工作目录收集用例时都能找到 common1、settings（pytest 7+）
pythonpath = .
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
addopts = -s
# 已安装 allure-pytest 时可在命令行追加: --alluredir=allure-results
markers =
    hardware: 需要连接真实机械臂/串口（testcases 下用例默认自动打标）
    slow: 长耗时用例（大范围运动、多步等待等）
    smoke: 快速冒烟，适合环境/连接首批验证
    regression: 回归用例（可选手动打标）
