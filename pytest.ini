# pytest.ini
[pytest]
pythonpath = .
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
addopts = -vs --tb=short --show-capture=all
# 已安装 allure-pytest 时可在命令行追加: --alluredir=allure-results
markers =
    hardware: 需要连接真实机械臂/串口（testcases 下用例默认自动打标）
    slow: 长耗时用例
    smoke: 快速冒烟
    regression: 回归用例
